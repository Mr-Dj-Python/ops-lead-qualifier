# Settings for the lead qualifier. Only the keys used so far are present;
# see docs/LOW_LEVEL_DESIGN.md section 7 for the full planned layout.

# Used by the recency factor and to reject future dates (the sample data ends in Jan 2024).
# Leave unset to default to today.
reference_date: "2024-01-21"

# Share of the final score for each factor; must add up to 1. Industry fit is scored by the LLM,
# the other three by the rules below. The values live in .env: ${NAME} is replaced by NAME
# from the .env file (a real environment variable of the same name takes priority).
weights:
  industry: ${WEIGHT_INDUSTRY}
  size: ${WEIGHT_SIZE}
  source: ${WEIGHT_SOURCE}
  recency: ${WEIGHT_RECENCY}

# Rule-based scoring (pipeline/rules.py). Each key names a registered rule; scores are 1-10.
rules:
  size:
    # Inclusive bands; the first match wins. Omit min or max for an open end.
    bands:
      - {min: 50, max: 500, score: 10, label: "target range"}
      - {min: 20, max: 49, score: 7, label: "a little small"}
      - {min: 501, max: 1000, score: 7, label: "a little large"}
      - {min: 10, max: 19, score: 4, label: "too small"}
      - {min: 1001, max: 5000, score: 4, label: "too large for a standard deal"}
      - {max: 9, score: 1, label: "under 10"}
      - {min: 5001, score: 1, label: "over 5,000"}
    missing_score: 5
  source:
    scores:
      "inbound demo request": 10
      "referral": 9
      "sales call": 8
      "webinar attendee": 6
      "content download": 5
      "linkedin outreach": 3
    unknown_score: 4
  recency:
    # Days since last interaction; first band with days <= max_days wins.
    bands:
      - {max_days: 14, score: 10}
      - {max_days: 30, score: 7}
      - {max_days: 90, score: 4}
    older_score: 1
    missing_score: 1

# Values (trimmed, case-insensitive) that mean "no data" and are converted to null.
# Keep them quoted: an unquoted null is read by YAML as an empty value, not text.
missing_values:
  - "na"
  - "n/a"
  - "null"
  - "none"
  - "unknown"
  - "unknown source"
  - "unknown sector"

# The company the prompts speak for (used to generate the LLM system prompt).
company:
  name: "OpsFlow"
  product: "operations software (inventory tracking, warehouse and fleet visibility, demand and supply planning) to companies that move, make or sell physical goods"

# Industry-fit tiers. The LLM prompt table and the response validator are both built from this,
# so a score must fall inside its tier's range. Industry lists are the labels seen in the data.
tiers:
  best:
    score_range: [9, 10]
    industries: [Logistics, Supply Chain, Manufacturing, Retail, Automotive, Trade]
    description: "Core need: moving and stocking physical goods"
  hard:
    score_range: [4, 6]
    industries: [Construction, Energy, Agriculture, Healthcare, Environmental, Consumer]
    description: "Some physical operations, but the need is partial, regulated or niche"
  none:
    score_range: [1, 3]
    industries: [Software, SaaS, Cybersecurity, AI/ML, Analytics, Finance, FinTech, Insurance, InsurTech, Cryptocurrency, Media, Entertainment, Telecom, Legal, Consulting, Marketing, Education, Government, NonProfit, Cultural, Hospitality, Events, Sports, Travel, Real Estate, Business Services, Services, Consumer Services, HR Tech, Climate Tech, HealthTech, Biotech, Pharmaceuticals]
    description: "Little or no physical-goods operations"
  unknown:
    score_range: [5, 5]
    description: "The label and name together do not make the business clear"

# LLM connection (pipeline/llm_client.py). The API key is never written here: it is read from
# the environment variable named by api_key_env, which you set in .env. To use another
# provider, register a client for it and change `provider` and `model`.
llm:
  provider: openai
  model: gpt-4o-mini
  api_key_env: LLM_API_KEY
  timeout_s: 30
  retries: {max_attempts: 4, base_delay_s: 2, max_delay_s: 30}   # rate limits, timeouts, 5xx
  validation_retries: 2   # re-asks for invalid or missing items in a batch
  # Leads per LLM call: LLM_BATCH_SIZE from .env, 10 when it is not set.
  scoring: {batch_size: "${LLM_BATCH_SIZE:-10}", temperature: 0, max_tokens: 1500}
  # Emails: same batch size, a little variation in wording (temperature), more room per lead.
  messaging: {batch_size: "${LLM_BATCH_SIZE:-10}", temperature: 0.7, max_tokens: 2000}

# Earlier industry answers, reused when company, industry and size match. Discarded whenever
# the model or prompt changes.
cache:
  enabled: true
  path: .cache/industry.json

# Decision rules (pipeline/decide.py), applied to the weighted score (1-10).
thresholds: {qualified: 7.0, review: 5.0}   # >= qualified: qualified; >= review: review; below: rejected
priority: {high: 8.5}                       # qualified leads at or above this are HIGH, the rest MEDIUM
caps:
  stale_days: 180                # no contact for longer than this caps the decision at review
  hard_reject_size_below: 10     # a no-fit industry with fewer employees is rejected outright
  hard_reject_size_above: 5000   # ... or with more employees

# Personalised first-touch emails for qualified leads (pipeline/messages.py). The prompt and the
# validator are both built from these values, so they cannot disagree.
messages:
  sender_name: "${SENDER_NAME:-The OpsFlow Team}"   # the line under "Best regards,"; set SENDER_NAME in .env
  call_minutes: 15              # the one number a message may mention besides the lead's own details
  min_words: 40                 # body length, greeting to sign-off
  max_words: 100
  max_subject_words: 10
  reengagement_after_days: 30   # no contact for longer than this: the re-engagement variant
  warm_sources: ["inbound demo request", "referral"]   # these sources get the warm follow-up

# Stage 6: the run report, the run log and the numbers behind "time saved" (pipeline/report.py).
# Runs with --score-industry write both files; --output and --log-file override these paths.
report:
  output_path: output_report.json
  log_path: run.log          # appended to; every line carries the run id
  log_level: INFO            # DEBUG, INFO or WARNING
  manual_minutes_per_lead: 10   # the brief: 8-12 minutes to decide one lead by hand
  sample_messages: 5         # example messages in the report (one per variant first)
